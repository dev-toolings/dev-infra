name: CI

on:
  push:
    branches: [main, develop, feat/devhub]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bash syntax check
        run: |
          for script in bin/devhub install-remote.sh data/scripts/*.sh; do bash -n "$script"; done

      - name: ShellCheck
        run: shellcheck -x --severity=warning bin/devhub install-remote.sh data/scripts/*.sh

      - name: TypeScript and backend tests
        run: |
          bun run typecheck
          python3 tests/backend-isolated.py

      - name: Infrastructure identity contract
        run: python3 tests/infra-contract.py

      - name: Compose config
        run: |
          for profiles in core async core,async proxy; do
            COMPOSE_PROFILES="$profiles" docker compose --env-file .env.example -f compose.yml config > /dev/null
          done

  test:
    name: Bats tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats

      - name: Run tests
        run: bats tests
