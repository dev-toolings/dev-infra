name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Bash syntax check
        run: |
          for script in bin/devhub install-remote.sh data/scripts/*.sh; do bash -n "$script"; done

      - name: ShellCheck
        run: shellcheck -x --severity=warning bin/devhub data/scripts/*.sh

      - name: Compose config
        run: |
          for profiles in core async core,async; do
            COMPOSE_PROFILES="$profiles" docker compose --env-file .env.example -f compose.yml config > /dev/null
          done

  test:
    name: Bats tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats

      - name: Run tests
        run: bats tests
