x-logging: &shared-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: infra-postgres
    profiles: [core]
    restart: unless-stopped
    logging: *shared-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devhub}
      POSTGRES_USER: ${POSTGRES_USER:-test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - infra_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dev-shared-net

  mysql:
    image: mysql:8.0
    container_name: infra-mysql
    profiles: [core]
    restart: unless-stopped
    logging: *shared-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-trading}
      MYSQL_USER: ${MYSQL_USER:-test}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-test}
    volumes:
      - infra_mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dev-shared-net

  mariadb:
    image: mariadb:12.3
    container_name: infra-mariadb
    profiles: [core]
    restart: unless-stopped
    logging: *shared-logging
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
    volumes:
      - infra_mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dev-shared-net

  redis:
    image: redis:7-alpine
    container_name: infra-redis
    profiles: [core]
    restart: unless-stopped
    logging: *shared-logging
    # Empty on fresh installs; existing ACL deployments set a path inside /data.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--aclfile", "${REDIS_ACL_FILE:-}"]
    volumes:
      - infra_redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - dev-shared-net

  meilisearch:
    image: ${MEILI_IMAGE:-getmeili/meilisearch:v1.48}
    container_name: infra-meilisearch
    profiles: [core]
    restart: unless-stopped
    logging: *shared-logging
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey}
      MEILI_ENV: development
      MEILI_LOG_LEVEL: INFO
    volumes:
      - infra_meili_data:/meili_data
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - dev-shared-net

  mailpit:
    image: axllent/mailpit:v1.30.7@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    container_name: infra-mailpit
    profiles: [core]
    restart: unless-stopped
    logging: *shared-logging
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - infra_mailpit_data:/data
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - dev-shared-net

  adminer:
    image: adminer:6.1.2@sha256:251295c1cd51d3889f1c42ffa4864b24eeab51f0caf395cfe5bf4726c5ec9a2a
    container_name: infra-adminer
    profiles: [core]
    restart: unless-stopped
    logging: *shared-logging
    environment:
      ADMINER_DEFAULT_SERVER: infra-postgres
      ADMINER_DESIGN: pepa-linha
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMINER_PORT:-9080}:8080"
    networks:
      - dev-shared-net

  dozzle:
    image: amir20/dozzle:v10.7.3@sha256:c32ca7a443796de62a07afd621b17b6c6c073320cd8431493bb1fd84e3a1eff8
    container_name: infra-dozzle
    profiles: [core]
    restart: unless-stopped
    logging: *shared-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-8888}:8080"
    networks:
      - dev-shared-net

  caddy:
    # Gives every DevHub project a name: http://shop.localhost, http://fix-auth.shop.localhost.
    # The host network reaches the apps on 127.0.0.1; the Caddyfile binds to loopback only.
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    container_name: infra-caddy
    profiles: [proxy]
    restart: unless-stopped
    logging: *shared-logging
    network_mode: host
    environment:
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:-80}
      CADDY_ADMIN_PORT: ${CADDY_ADMIN_PORT:-2019}
    volumes:
      # DevHub writes sites/devhub.caddy, then reloads Caddy.
      - ./data/caddy:/etc/caddy:ro
    tmpfs:
      - /data
      - /config

  rabbitmq:
    # 4.x line: 3.13 left community support and carries CVE-2026-57212/57213/44839.
    # Upgrading across minors needs every stable feature flag enabled first
    # (rabbitmqctl enable_feature_flag all after each upgrade).
    image: rabbitmq:4-management-alpine
    container_name: infra-rabbitmq
    # Fixed hostname: RabbitMQ keeps its state under mnesia/rabbit@<hostname>,
    # so a container-id hostname restarts on an empty node after every recreate.
    hostname: infra-rabbitmq
    profiles: [async]
    restart: unless-stopped
    logging: *shared-logging
    environment:
      RABBITMQ_NODENAME: rabbit@infra-rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    volumes:
      - infra_rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - dev-shared-net

volumes:
  infra_postgres_data:
  infra_redis_data:
  infra_meili_data:
  infra_mailpit_data:
  infra_rabbitmq_data:
  infra_mysql_data:
  infra_mariadb_data:

networks:
  dev-shared-net:
    name: dev-shared-net
    external: true
